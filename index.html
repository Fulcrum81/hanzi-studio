<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Learn Chinese characters – stroke order animation, pinyin, definitions, and handwriting practice.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Hanzi Studio</title>

  <!-- Hanzi Writer from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

  <!-- Embedded dictionary (pinyin + definitions for common characters) -->
  <script src="dictionary.js"></script>

  <script src="i18n.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- ===== Top Bar ===== -->
  <header class="top-bar">
    <div class="app-title">
      <span class="logo-char">字</span>
      <span class="logo-text">Hanzi Studio</span>
    </div>
    <div class="header-controls">
      <div class="lang-selector">
        <button class="lang-btn active" data-lang="en" data-i18n-title="lang.switch" title="Language">EN</button>
        <button class="lang-btn" data-lang="ru" data-i18n-title="lang.switch" title="Language">RU</button>
      </div>
      <button id="themeToggle" class="icon-btn" data-i18n-title="search.random" title="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- ===== Search Section ===== -->
  <section class="search-section">
    <div class="search-box">
      <div class="search-wrapper">
        <input type="text" id="charInput" data-i18n-placeholder="search.placeholder" placeholder="Type a Chinese character, English word, or pinyin…" maxlength="20" autofocus>
        <div class="autocomplete-list" id="autocompleteList"></div>
      </div>
      <button id="searchBtn" class="primary-btn" data-i18n="search.btn">Search</button>
      <button id="randomBtn" class="icon-btn" data-i18n-title="search.random" title="Random character">🎲</button>
    </div>
  </section>

  <!-- ===== Main Content ===== -->
  <main class="main-content" id="mainContent">

    <!-- Splash / welcome -->
    <div class="splash" id="splash">
      <div class="splash-char">字</div>
      <p class="splash-sub" data-i18n="splash.text">Search any Chinese character to see its stroke order, pinyin, and meaning.<br>Then practice writing it yourself!</p>
    </div>

    <!-- Character result panel -->
    <div class="result-panel hidden" id="resultPanel">

      <!-- Info card -->
      <div class="info-card" id="infoCard">
        <div class="info-character">
          <span class="info-hanzi" id="infoHanzi"></span>
          <span class="info-pinyin" id="infoPinyin"></span>
        </div>
        <div class="info-definition" id="infoDefinition"></div>
        <div class="info-radical" id="infoRadical"></div>
      </div>

      <!-- Tab bar -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="animate" data-i18n="tab.animate">▶ Stroke Order</button>
        <button class="tab-btn" data-tab="practice" data-i18n="tab.practice">✍ Practice</button>
      </div>

      <!-- Tab content: Stroke Order Animation -->
      <div class="tab-content active" id="tabAnimate">
        <div class="canvas-container">
          <div id="animationTarget"></div>
        </div>
        <div class="button-row">
          <button id="playBtn" class="primary-btn" data-i18n="animation.play">▶ Play Animation</button>
          <button id="loopBtn" class="secondary-btn" data-i18n="animation.loop">🔁 Loop</button>
        </div>
        <div class="speed-selector" id="speedSelector">
          <button class="speed-btn" data-speed="slow" data-i18n="speed.slow">🐢 Slow</button>
          <button class="speed-btn active" data-speed="medium" data-i18n="speed.medium">⚡ Medium</button>
          <button class="speed-btn" data-speed="fast" data-i18n="speed.fast">🚀 Fast</button>
        </div>
        <div class="stroke-info"><span data-i18n="stroke.label">Strokes:</span> <span id="strokeCount">0</span></div>
      </div>

      <!-- Tab content: Practice Writing -->
      <div class="tab-content" id="tabPractice">
        <div class="quiz-status-bar">
          <span id="quizStatus" data-i18n="practice.draw">Draw the character below</span>
          <span id="quizProgress"></span>
        </div>
        <div class="char-navigator hidden" id="charNavigator">
          <button id="prevCharBtn" class="secondary-btn" data-i18n="char.prev">← Prev</button>
          <span id="charCounter"></span>
          <button id="nextCharBtn" class="secondary-btn" data-i18n="char.next">Next →</button>
        </div>
        <div class="canvas-container practice-container">
          <div id="practiceTarget"></div>
        </div>
        <div class="button-row">
          <button id="outlineToggleBtn" class="primary-btn" data-i18n="outline.hide">◻ Hide Outline</button>
          <button id="showHintBtn" class="secondary-btn" data-i18n="hint.text">💡 Hint</button>
          <button id="resetQuizBtn" class="secondary-btn" data-i18n="reset.btn">🔄 Reset &amp; Redraw</button>
        </div>
      </div>

    </div>

    <!-- History bar -->
    <div class="history-bar hidden" id="historyBar">
      <span class="history-label" data-i18n="history.label">Recent:</span>
      <div class="history-chips" id="historyChips"></div>
    </div>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <p data-i18n="footer.text">Powered by <a href="https://hanziwriter.org" target="_blank" rel="noopener">Hanzi Writer</a> · Data from <a href="https://github.com/skishore/makemeahanzi" target="_blank" rel="noopener">Make Me a Hanzi</a></p>
  </footer>

  <script src="app.js"></script>
  <script>
    // Register service worker for PWA offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          console.log('Hanzi Studio SW registered:', reg.scope);
        }).catch(function (err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
